<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounted Categories - GreenGrocer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('/static/img/veggie_background2.0.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            padding-bottom: 70px;
        }

        #topheader {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 9999 !important;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            pointer-events: auto;
        }

        body {
            margin-top: 70px;
        }
    </style>
</head>
<body>
    <!-- Include Top Header -->
    <div id="topheader">
        {% include 'topheader.html' %}
        <!-- Example User Dropdown -->
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                User
            </button>
            <ul class="dropdown-menu" aria-labelledby="userDropdown">
                <li><a class="dropdown-item" href="/profile">Profile</a></li>
                <li><a class="dropdown-item" href="/settings">Settings</a></li>
                <li><a class="dropdown-item" href="/logout">Logout</a></li>
            </ul>
        </div>
        <!-- Example "All Categories" Dropdown -->
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="categoriesDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                All Categories
            </button>
            <ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
                <li><a class="dropdown-item" href="/category/vegetables">Vegetables</a></li>
                <li><a class="dropdown-item" href="/category/meats">Meats</a></li>
                <li><a class="dropdown-item" href="/category/fruits">Fruits</a></li>
                <li><a class="dropdown-item" href="/category/snacks">Snacks</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-5">
        <h2 class="text-center">Discounted Categories</h2>
        <!-- Category Content -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Debug Dropdown Initialization
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownElements = document.querySelectorAll('.dropdown-toggle');
            if (dropdownElements.length === 0) {
                console.error('No dropdown elements found.');
            } else {
                console.log(`${dropdownElements.length} dropdowns found.`);
                dropdownElements.forEach(dropdown => {
                    new bootstrap.Dropdown(dropdown); // Manually initialize
                });
            }
        });
    </script>
</body>
</html>
