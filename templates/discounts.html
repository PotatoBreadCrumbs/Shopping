<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounted Categories - GreenGrocer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('/static/img/veggie_background2.0.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            padding-bottom: 70px;
        }

        #topheader {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 9999; /* Always on top */
            background-color: white; /* Prevent transparency issues */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional shadow */
        }

        body {
            margin-top: 70px; /* Prevent content overlap with header */
        }

        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 0 20px;
        }

        .category-card {
            background-color: #d9d9d9;
            width: 180px;
            margin: 15px;
            text-align: center;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .category-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .category-card img {
            width: 130px;
            height: 100px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .category-card h4 {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="topheader">
        {% include 'topheader.html' %}
    </div>

    <div class="container mt-5">
        <h2 class="text-center">Discounted Categories</h2>
        <div class="category-container">
            <a href="/discounts/Vegetables" class="category-card">
                <img src="/static/img/vegetables.png" alt="Vegetables">
                <h4>Vegetables</h4>
            </a>
            <a href="/discounts/Meats" class="category-card">
                <img src="/static/img/meats.png" alt="Meats">
                <h4>Meats</h4>
            </a>
            <a href="/discounts/Fruits" class="category-card">
                <img src="/static/img/fruits.png" alt="Fruits">
                <h4>Fruits</h4>
            </a>
        </div>
    </div>

    {% include 'footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('#topheader a').forEach(link => {
            link.addEventListener('click', function(e) {
                console.log(`Clicked: ${this.href}`);
            });
        });
    </script>
</body>
</html>
